# lemmata prover/refuter profile.
#
# Copy this file, lemmata-math.md and (optionally) requirements.toml into a
# dedicated CODEX_HOME, then run `codex --profile lemmata ...`. See lemmata/README.md.
# This file is self-contained: it does not rely on anything in config.toml.

# --- Model, auth, instructions --------------------------------------------------
model_provider = "openai"
forced_login_method = "chatgpt"
# Resolved relative to this file.
model_instructions_file = "lemmata-math.md"
project_doc_max_bytes = 0
include_permissions_instructions = false
include_apps_instructions = false
include_collaboration_mode_instructions = false
include_environment_context = false

# --- No side effects ------------------------------------------------------------
approval_policy = "never"
sandbox_mode = "read-only"
web_search = "disabled"
check_for_update_on_startup = false

# --- Fork switch (lemmata patches) --------------------------------------------
[lemmata]
# The single fork-only switch. Gates non-math extensions in app-server and turns
# on the hard tool allowlist below. Entries are `name` or `namespace/name`.
# MCP tools live in the `mcp__<server>` namespace. Keep this list equal to the union of
# the `enabled_tools` lists below. verdict/freeze_statement is operator-only and absent.
mode = true
research = false
allowed_tools = [
  # lean: warm REPL
  "mcp__lean/check",
  "mcp__lean/portfolio",
  "mcp__lean/repair",
  "mcp__lean/register_lemma",
  "mcp__lean/step",
  "mcp__lean/batch_check",
  # lean_lsp: lean-lsp-mcp on Scratch/ files written by lean/check save_as
  "mcp__lean_lsp/lean_goal",
  "mcp__lean_lsp/lean_term_goal",
  "mcp__lean_lsp/lean_diagnostic_messages",
  "mcp__lean_lsp/lean_hover_info",
  "mcp__lean_lsp/lean_completions",
  "mcp__lean_lsp/lean_code_actions",
  "mcp__lean_lsp/lean_file_outline",
  "mcp__lean_lsp/lean_declaration_file",
  "mcp__lean_lsp/lean_references",
  "mcp__lean_lsp/lean_multi_attempt",
  "mcp__lean_lsp/lean_run_code",
  "mcp__lean_lsp/lean_verify",
  "mcp__lean_lsp/lean_minimal_hypotheses",
  "mcp__lean_lsp/lean_local_search",
  "mcp__lean_lsp/lean_loogle",
  # library
  "mcp__library/search_decls",
  "mcp__library/decl_info",
  "mcp__library/formal_conjectures",
  "mcp__library/oeis",
  "mcp__library/pi_base",
  # compute
  "mcp__compute/enumerate",
  "mcp__compute/graph_search",
  "mcp__compute/sat_solve",
  "mcp__compute/sage",
  "mcp__compute/ideal_cofactors",
  "mcp__compute/interval_sign",
  "mcp__compute/gap",
  "mcp__compute/pari",
  "mcp__compute/macaulay2",
  "mcp__compute/mace4",
  "mcp__compute/snappy",
  "mcp__compute/exact_lp",
  "mcp__compute/sos_certificate",
  "mcp__compute/pslq",
  "mcp__compute/local_search",
  "mcp__compute/conjecture_mine",
  "mcp__compute/evolve",
  # verdict
  "mcp__verdict/get_challenge",
  "mcp__verdict/replay_witness",
  "mcp__verdict/check_equivalence",
  "mcp__verdict/submit_verdict",
  # whiteboard
  "mcp__whiteboard/read",
  "mcp__whiteboard/lemma_add",
  "mcp__whiteboard/lemma_update",
  "mcp__whiteboard/dead_end_add",
  "mcp__whiteboard/dead_end_find",
  "mcp__whiteboard/coverage_add",
]

# Model-side multi-agent: the model catalog picks multi-agent v2 unless this is off.
[agents]
enabled = false

[skills]
include_instructions = false

[skills.bundled]
enabled = false

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
metrics_exporter = "none"
log_user_prompt = false

[features]
# Shell / exec / unified exec / shell snapshot.
# apply_patch and git attribution have no flag: the allowlist, the read-only
# sandbox and the lemmata extension gate keep them out.
shell_tool = false
unified_exec = false
unified_exec_tty = false
shell_snapshot = false
shell_snapshot_v2 = false
exec_permission_approvals = false
write_stdin_approval = false
request_permissions_tool = false
# Web search (only the lemmata-research profile turns it back on)
web_search_indexed_default = false
standalone_web_search = false
# Images
image_generation = false
defer_image_generation = false
image_generation_animation = false
view_image = false
# Browser / computer use
in_app_browser = false
browser_annotation_api = false
browser_use = false
browser_use_full_cdp_access = false
browser_use_external = false
computer_use = false
# Code mode
code_mode = false
code_mode_host = false
code_mode_only = false
# Plugins / marketplace / tool suggest
plugins = false
remote_plugin = false
plugin_sharing = false
recommended_plugins = false
tool_suggest = false
# Apps / connectors
apps = false
enable_mcp_apps = false
catalog_apps_instructions = false
apps_early_resource_discovery = false
codex_apps_mcp_2026_07_28 = false
psp = false
# Skills
skill_mcp_dependency_install = false
# Guardian / code review
guardian_approval = false
guardianv2 = false
guardianv3 = false
# Model-side multi-agent
multi_agent = false
multi_agent_v2 = false
agent_message_board = false
agent_message_board_mcp = false
wake_on_agent_messages = false
# Memories
memories = false
external_agent_memory_import = false
# Goals and other non-math helpers
goals = false
sleep_tool = false
current_time_reminder = false
default_mode_request_user_input = false
send_message_to_user_async = false
chronicle = false
artifact = false
# Environments / sandbox services
multi_env_copy_file = false
deferred_executor = false
windows_sandbox_service = false
prefer_mxc = false
network_proxy = false
# Telemetry / analytics
statsig_gates = false
analytics_plan_history = false
runtime_metrics = false
# Updates
in_app_updates = false
daemon_updates = false
daemon_auto_start = false
# Cloud / realtime / remote control / desktop surfaces
realtime_frames_local = false
in_app_voice = false
in_app_dictation = false
in_app_chat = false
in_app_local_automation = false
bedrock_setup_wizard = false
gcp_setup_wizard = false
gateway_setup_wizard = false
cli_daybreak = false
api_key_cyber_access_programs = false
daybreak_program_propagation = false

# --- Math tools (lemmata/mcp, installed in WSL by lemmata/mcp/setup-wsl.sh) -----
# Codex on Windows starts each server through wsl.exe. If codex itself runs inside
# WSL, use command = "/home/<you>/.lemmata/bin/lemmata-mcp" and args = ["<server>"].
# `-d Ubuntu` must match WSL_DISTRO in lemmata/mcp/lemmata_mcp/pins.env.

[mcp_servers.lean]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "lean"]
startup_timeout_sec = 120
tool_timeout_sec = 1800
enabled_tools = ["check", "portfolio", "repair", "register_lemma", "step", "batch_check"]

[mcp_servers.lean_lsp]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "lean_lsp"]
startup_timeout_sec = 120
# The first lean_loogle call builds the local Loogle index (minutes).
tool_timeout_sec = 1800
enabled_tools = [
  "lean_goal", "lean_term_goal", "lean_diagnostic_messages", "lean_hover_info",
  "lean_completions", "lean_code_actions", "lean_file_outline", "lean_declaration_file",
  "lean_references", "lean_multi_attempt", "lean_run_code", "lean_verify",
  "lean_minimal_hypotheses", "lean_local_search", "lean_loogle",
]

[mcp_servers.library]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "library"]
startup_timeout_sec = 120
tool_timeout_sec = 120
# lmfdb needs the network: research profile only.
enabled_tools = ["search_decls", "decl_info", "formal_conjectures", "oeis", "pi_base"]

[mcp_servers.compute]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "compute"]
startup_timeout_sec = 120
tool_timeout_sec = 3600
enabled_tools = [
  "enumerate", "graph_search", "sat_solve", "sage", "ideal_cofactors", "interval_sign",
  "gap", "pari", "macaulay2", "mace4", "snappy", "exact_lp", "sos_certificate", "pslq",
  "local_search", "conjecture_mine", "evolve",
]

[mcp_servers.verdict]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "verdict"]
startup_timeout_sec = 120
tool_timeout_sec = 3700  # comparator may take up to an hour on a large proof
enabled_tools = ["get_challenge", "replay_witness", "check_equivalence", "submit_verdict"]

[mcp_servers.whiteboard]
command = "wsl.exe"
args = ["-d", "Ubuntu", "--cd", "~", "--exec", ".lemmata/bin/lemmata-mcp", "whiteboard"]
startup_timeout_sec = 120
tool_timeout_sec = 60
enabled_tools = [
  "read", "lemma_add", "lemma_update", "dead_end_add", "dead_end_find", "coverage_add",
]
